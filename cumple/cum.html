<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 50% 50%, rgba(70,30,150,.22), transparent 45%),
    radial-gradient(circle at 20% 20%, rgba(30,50,180,.15), transparent 35%),
    radial-gradient(circle at 80% 80%, rgba(170,20,150,.12), transparent 40%),
    #000;
}
#space{position:fixed;inset:0;overflow:hidden;z-index:0}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.5)}to{opacity:1;transform:scale(1.5)}}
.nebula{position:absolute;width:900px;height:900px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, rgba(70,30,255,.15), rgba(220,20,170,.06), transparent 70%);filter:blur(90px)}
.scene{position:fixed;inset:0;perspective:1800px;z-index:10}
.carousel{position:absolute;width:0;height:0;left:50%;top:50%;transform-style:preserve-3d}
.card{
  position:absolute;width:210px;height:290px;left:-105px;top:-145px;border-radius:14px;overflow:hidden;
  background:#111;border:2px solid rgba(255,255,255,.85);
  box-shadow:0 0 12px rgba(255,255,255,.5), 0 0 35px rgba(100,70,255,.4);
  transform-style:preserve-3d;cursor:pointer;user-select:none;
}
.card img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.card:hover{box-shadow:0 0 20px #fff, 0 0 55px rgba(120,80,255,.9)}
.title{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:100;color:#fff;font-size:clamp(13px,2vw,20px);letter-spacing:4px;opacity:.65;text-align:center}
.hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;color:rgba(255,255,255,.45);font-size:12px;letter-spacing:1px}
.viewer{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.94);backdrop-filter:blur(15px);opacity:0;visibility:hidden;transition:opacity .3s ease;
}
.viewer.active{opacity:1;visibility:visible}
.viewer img{max-width:88vw;max-height:88vh;object-fit:contain;border-radius:12px;box-shadow:0 0 40px rgba(255,255,255,.5);transform:scale(.75);transition:transform .35s ease}
.viewer.active img{transform:scale(1)}
.close{
  position:absolute;right:25px;top:25px;width:50px;height:50px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.7);color:#fff;font-size:32px;cursor:pointer;z-index:10;transition:.3s;
}
.close:hover{background:#fff;color:#000;transform:rotate(90deg)}
@media(max-width:700px){.card{width:140px;height:200px;left:-70px;top:-100px}}
</style>
</head>
<body>

<div id="space"><div class="nebula"></div></div>
<div class="title">LAS IMÁGENES GUARDAN RECUERDOS</div>

<div class="scene">
  <div class="carousel" id="carousel">
    <div class="card"><img src="ima1.jpg"></div>
    <div class="card"><img src="ima2.jpg"></div>
    <div class="card"><img src="ima3.jpg"></div>
    <div class="card"><img src="ima4.jpg"></div>
    <div class="card"><img src="ima5.jpg"></div>
    <div class="card"><img src="ima6.jpg"></div>
    <div class="card"><img src="ima7.jpg"></div>
    <div class="card"><img src="ima8.jpg"></div>
  </div>
</div>

<div class="hint">Haz clic en una imagen para verla</div>

<div class="viewer" id="viewer">
  <button class="close" id="close">×</button>
  <img id="viewerImage" src="">
</div>

<script>
/* ---------- Estrellas de fondo (universo/galaxia, sin Saturno) ---------- */
const space = document.getElementById("space");
for(let i=0;i<350;i++){
  const s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*100+"%";
  s.style.top = Math.random()*100+"%";
  const size = Math.random()*2.5+.5;
  s.style.width = size+"px";
  s.style.height = size+"px";
  s.style.animationDelay = Math.random()*4+"s";
  space.appendChild(s);
}

/* ---------- Config del carrusel ---------- */
const cards = document.querySelectorAll(".card");
const total = cards.length;

let radiusX = innerWidth < 700 ? 210 : 340;
let radiusZ = innerWidth < 700 ? 150 : 260;

let rotation = 0;
let rotating = false;
let zoomedIdx = null;

/* Imágenes más sólidas, menos transparencia en los costados */
function mapScale(z){ return .6 + ((z+radiusZ)/(radiusZ*2))*.5; }
function mapOpacity(z){ return Math.max(.65, (z+radiusZ)/(radiusZ*2)+.25); }

/* Posición de cada carta mientras espera apilada detrás de la del frente */
function stackPos(slot){
  if(slot===0) return {x:0,y:0,z:radiusZ,rotY:0,scale:1,opacity:1};
  const side = slot%2===0 ? 1 : -1;
  return {
    x: side*Math.min(slot,4)*11,
    y: -slot*4,
    z: radiusZ - slot*42,
    rotY: side*Math.min(slot,3)*7,
    scale: Math.max(.55, 1-slot*.06),
    opacity: Math.max(.55, 1-slot*.08)
  };
}

/* Posición de cada carta ya ubicada en su lugar del círculo */
function circlePos(angle){
  const rad = angle*Math.PI/180;
  const x = Math.sin(rad)*radiusX;
  const z = Math.cos(rad)*radiusZ;
  const y = Math.sin(rad*2)*15;
  return {
    transform:`translate3d(${x}px,${y}px,${z}px) rotateY(${-angle}deg) scale(${mapScale(z)})`,
    opacity: mapOpacity(z),
    zIndex: 1000+Math.round(z)
  };
}

function setCardTransform(card,x,y,z,rotY,scale,opacity){
  card.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateY(${rotY}deg) scale(${scale})`;
  card.style.opacity = opacity;
  card.style.zIndex = 1000+Math.round(z);
}

/* Estado inicial: la primera carta al frente (fija, "en el medio"),
   las demás apiladas detrás esperando su turno */
cards.forEach((card,idx)=>{
  card.style.transition = "none";
  const p = stackPos(idx);
  setCardTransform(card,p.x,p.y,p.z,p.rotY,p.scale,p.opacity);
});

/* ---------- Revelado: cada carta sale, gira y se QUEDA en su propio
   lugar del círculo (no todas vuelven al frente) ---------- */
let nextIdx = 1;

function revealNext(){
  if(nextIdx >= total){ startOrbit(); return; }
  const idx = nextIdx;
  const card = cards[idx];
  const targetAngle = idx*(360/total);

  card.style.transition = "none";
  const start = performance.now();
  const duration = 1400;

  function loop(t){
    let p = (t-start)/duration;
    if(p>1) p=1;
    const angle = p*(targetAngle+360); /* gira de más y se detiene justo en su lugar */
    const rad = angle*Math.PI/180;
    const x = Math.sin(rad)*radiusX;
    const z = Math.cos(rad)*radiusZ;
    const y = Math.sin(rad*2)*18;
    setCardTransform(card,x,y,z,-angle,mapScale(z),mapOpacity(z));

    if(p<1){ requestAnimationFrame(loop); }
    else{
      const fin = circlePos(targetAngle);
      card.style.transform = fin.transform;
      card.style.opacity = fin.opacity;
      card.style.zIndex = fin.zIndex;
      nextIdx++;
      if(nextIdx < total) setTimeout(revealNext, 250);
      else startOrbit();
    }
  }
  requestAnimationFrame(loop);
}

/* Ya está el círculo completo: ahora todo empieza a girar (sentido invertido) */
function startOrbit(){
  setTimeout(()=>{ rotating = true; }, 300);
}

function orbitLoop(){
  if(rotating){
    rotation += 0.09; /* giro invertido respecto a la versión anterior */
    cards.forEach((card,idx)=>{
      if(idx===zoomedIdx) return;
      card.style.transition = "";
      const angle = idx*(360/total) + rotation;
      const pos = circlePos(angle);
      card.style.transform = pos.transform;
      card.style.opacity = pos.opacity;
      card.style.zIndex = pos.zIndex;
    });
  }
  requestAnimationFrame(orbitLoop);
}
orbitLoop();

/* Inicio: breve pausa mostrando la pila, luego empieza el revelado */
setTimeout(revealNext, 1600);

/* ---------- Zoom + visor ---------- */
const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");
const closeBtn = document.getElementById("close");

cards.forEach((card,idx)=>{
  card.addEventListener("click", ()=>{
    card.style.transition = "transform .25s ease";
    card.style.transform += " scale(1.3)";
    zoomedIdx = idx;
    rotating = false;

    setTimeout(()=>{
      viewerImage.src = card.querySelector("img").src;
      viewer.classList.add("active");
    }, 180);
  });
});

function closeViewer(){
  viewer.classList.remove("active");
  zoomedIdx = null;
  if(nextIdx >= total) rotating = true;
}
closeBtn.addEventListener("click", closeViewer);
viewer.addEventListener("click", e=>{ if(e.target===viewer) closeViewer(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeViewer(); });

/* ---------- Responsive ---------- */
addEventListener("resize", ()=>{
  radiusX = innerWidth < 700 ? 210 : 340;
  radiusZ = innerWidth < 700 ? 150 : 260;
});
</script>
</body>
</html>
