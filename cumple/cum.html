<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;touch-action:none}
body{
  background:
    radial-gradient(circle at 50% 50%, rgba(70,30,150,.22), transparent 45%),
    radial-gradient(circle at 20% 20%, rgba(30,50,180,.15), transparent 35%),
    radial-gradient(circle at 80% 80%, rgba(170,20,150,.12), transparent 40%),
    #000;
}
#space{position:fixed;inset:0;overflow:hidden;z-index:0}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.5)}to{opacity:1;transform:scale(1.5)}}
.nebula{position:absolute;width:900px;height:900px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, rgba(70,30,255,.15), rgba(220,20,170,.06), transparent 70%);filter:blur(90px)}
.scene{position:fixed;inset:0;perspective:1800px;z-index:10;cursor:grab}
.scene:active{cursor:grabbing}
.carousel{position:absolute;width:0;height:0;left:50%;top:50%;transform-style:preserve-3d}

.card{
  position:absolute;left:50%;top:50%;
  width:clamp(120px,34vw,210px);
  height:clamp(166px,47vw,290px);
  border-radius:14px;overflow:hidden;
  background:#111;border:2px solid rgba(255,255,255,.85);
  box-shadow:0 0 12px rgba(255,255,255,.5), 0 0 35px rgba(100,70,255,.4);
  transform-style:preserve-3d;cursor:pointer;user-select:none;
}
.card img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.card:hover{box-shadow:0 0 20px #fff, 0 0 55px rgba(120,80,255,.9)}
.title{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;color:#fff;font-size:clamp(12px,2.2vw,20px);letter-spacing:3px;opacity:.65;text-align:center;padding:0 12px}
.hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;color:rgba(255,255,255,.45);font-size:12px;letter-spacing:1px;text-align:center;padding:0 12px}
.viewer{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.94);backdrop-filter:blur(15px);opacity:0;visibility:hidden;transition:opacity .3s ease;
}
.viewer.active{opacity:1;visibility:visible}
.viewer img{max-width:88vw;max-height:88vh;object-fit:contain;border-radius:12px;box-shadow:0 0 40px rgba(255,255,255,.5);transform:scale(.75);transition:transform .35s ease}
.viewer.active img{transform:scale(1)}
.close{
  position:absolute;right:18px;top:18px;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.7);color:#fff;font-size:30px;cursor:pointer;z-index:10;transition:.3s;
}
.close:hover{background:#fff;color:#000;transform:rotate(90deg)}
</style>
</head>
<body>

<div id="space"><div class="nebula"></div></div>
<div class="title">DETALLES SILENCIOSOS QUE CAPTURE, SOLO POR QUE EN ELLOS SE REFLEJABA LO MAS BONITO DE TI</div>

<div class="scene" id="scene">
  <div class="carousel" id="carousel">
    <div class="card"><img src="ima1.jpg"></div>
    <div class="card"><img src="ima2.jpg"></div>
    <div class="card"><img src="ima3.jpg"></div>
    <div class="card"><img src="ima4.jpg"></div>
    <div class="card"><img src="ima5.jpeg"></div>
    <div class="card"><img src="ima6.jpg"></div>
    <div class="card"><img src="ima7.jpg"></div>
    <div class="card"><img src="ima8.jpg"></div>
    <div class="card"><img src="ima10.jpg"></div>
    <div class="card"><img src="ima9.jpg"></div>
  </div>
</div>

<div class="hint">Arrastrá para girar la vista · Tocá una imagen para verla</div>

<div class="viewer" id="viewer">
  <button class="close" id="close">×</button>
  <img id="viewerImage" src="">
</div>

<script>
/* ---------- Estrellas de fondo ---------- */
const space = document.getElementById("space");
for(let i=0;i<350;i++){
  const s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*100+"%";
  s.style.top = Math.random()*100+"%";
  const size = Math.random()*2.5+.5;
  s.style.width = size+"px";
  s.style.height = size+"px";
  s.style.animationDelay = Math.random()*4+"s";
  space.appendChild(s);
}

/* ---------- Config del carrusel ---------- */
const scene = document.getElementById("scene");
const carousel = document.getElementById("carousel");
const cards = document.querySelectorAll(".card");
const total = cards.length;

let radiusX = 340, radiusZ = 260;
function updateRadius(){
  radiusX = Math.max(130, Math.min(340, innerWidth*0.4));
  radiusZ = radiusX*0.76;
}
updateRadius();

let rotation = 0;     // giro horizontal (automático + arrastre del dedo)
let tiltX = 0;         // inclinación vertical (arrastre del dedo)
let rotating = false;
let zoomedIdx = null;

function mapScale(z){ return .5 + ((z+radiusZ)/(radiusZ*2))*.42; }
function mapOpacity(z){ return Math.max(.65, (z+radiusZ)/(radiusZ*2)+.25); }

/* Todas las cartas esperan pequeñas, apiladas en el centro */
function stackPos(slot){
  return {
    x: 0, y: 0,
    z: slot*-4,
    rotY: (slot%2===0?1:-1)*4,
    scale: Math.max(.18, .3 - slot*.012),
    opacity: Math.max(.3, .5 - slot*.02)
  };
}

function circlePos(angle){
  const rad = angle*Math.PI/180;
  const x = Math.sin(rad)*radiusX;
  const z = Math.cos(rad)*radiusZ;
  const y = Math.sin(rad*2)*15;
  return {
    /* sin rotateY: la carta se desliza por el círculo pero siempre mira de frente */
    transform:`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) scale(${mapScale(z)})`,
    opacity: mapOpacity(z),
    zIndex: 1000+Math.round(z)
  };
}

function setCardTransform(card,x,y,z,rotY,scale,opacity){
  card.style.transform = `translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateY(${rotY}deg) scale(${scale})`;
  card.style.opacity = opacity;
  card.style.zIndex = 1000+Math.round(z);
}

/* Estado inicial: TODAS pequeñas y apiladas, ninguna aparece grande todavía */
cards.forEach((card,idx)=>{
  card.style.transition = "none";
  const p = stackPos(idx);
  setCardTransform(card,p.x,p.y,p.z,p.rotY,p.scale,p.opacity);
});

/* Orden de salida: la carta 0 sale AL FINAL para quedar en el centro;
   las demás salen antes y se acomodan a su lado, hacia la izquierda */
const revealOrder = [];
for(let i=1;i<total;i++) revealOrder.push(i);
revealOrder.push(0);

let revealPos = 0;

function revealNext(){
  if(revealPos >= total){ startOrbit(); return; }
  const idx = revealOrder[revealPos];
  const card = cards[idx];
  const targetAngle = -idx*(360/total); /* idx 0 -> ángulo 0 = el centro */

  card.style.transition = "none";
  const start = performance.now();
  const duration = 1400;

  function loop(t){
    let p = (t-start)/duration;
    if(p>1) p=1;
    const angle = p*(targetAngle-360);
    const rad = angle*Math.PI/180;
    const x = Math.sin(rad)*radiusX;
    const z = Math.cos(rad)*radiusZ;
    const y = Math.sin(rad*2)*18;

    const growth = .12 + p*.88; /* nace chiquita y crece hasta su tamaño al llegar */
    setCardTransform(card,x,y,z,0,mapScale(z)*growth,mapOpacity(z));

    if(p<1){ requestAnimationFrame(loop); }
    else{
      const fin = circlePos(targetAngle);
      card.style.transform = fin.transform;
      card.style.opacity = fin.opacity;
      card.style.zIndex = fin.zIndex;
      revealPos++;
      if(revealPos < total) setTimeout(revealNext, 250);
      else startOrbit();
    }
  }
  requestAnimationFrame(loop);
}

function startOrbit(){
  setTimeout(()=>{ rotating = true; }, 300);
}

function orbitLoop(){
  if(rotating) rotation += 0.09;
  carousel.style.transform = `rotateX(${tiltX}deg)`;
  cards.forEach((card,idx)=>{
    if(idx===zoomedIdx) return;
    if(revealPos <= revealOrder.indexOf(idx)) return; /* aún no salió */
    card.style.transition = "";
    const angle = -idx*(360/total) + rotation;
    const pos = circlePos(angle);
    card.style.transform = pos.transform;
    card.style.opacity = pos.opacity;
    card.style.zIndex = pos.zIndex;
  });
  requestAnimationFrame(orbitLoop);
}
orbitLoop();

setTimeout(revealNext, 1600);

/* ---------- Arrastrar con el dedo / mouse para ver otros ángulos ---------- */
let dragging = false, lastX = 0, lastY = 0;

function dragStart(e){
  dragging = true;
  const p = e.touches ? e.touches[0] : e;
  lastX = p.clientX; lastY = p.clientY;
}
function dragMove(e){
  if(!dragging) return;
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX-lastX, dy = p.clientY-lastY;
  lastX = p.clientX; lastY = p.clientY;
  rotation += dx*0.3;
  tiltX = Math.max(-25, Math.min(25, tiltX - dy*0.15));
}
function dragEnd(){ dragging = false; }

scene.addEventListener("mousedown", dragStart);
addEventListener("mousemove", dragMove);
addEventListener("mouseup", dragEnd);
scene.addEventListener("touchstart", dragStart, {passive:true});
scene.addEventListener("touchmove", dragMove, {passive:true});
scene.addEventListener("touchend", dragEnd);

/* ---------- Zoom + visor ---------- */
const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");
const closeBtn = document.getElementById("close");

cards.forEach((card,idx)=>{
  card.addEventListener("click", ()=>{
    if(dragging) return;
    card.style.transition = "transform .25s ease";
    card.style.transform += " scale(1.25)";
    zoomedIdx = idx;
    rotating = false;

    setTimeout(()=>{
      viewerImage.src = card.querySelector("img").src;
      viewer.classList.add("active");
    }, 180);
  });
});

function closeViewer(){
  viewer.classList.remove("active");
  zoomedIdx = null;
  if(revealPos >= total) rotating = true;
}
closeBtn.addEventListener("click", closeViewer);
viewer.addEventListener("click", e=>{ if(e.target===viewer) closeViewer(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeViewer(); });

/* ---------- Responsive ---------- */
addEventListener("resize", updateRadius);
</script>
</body>
</html>
